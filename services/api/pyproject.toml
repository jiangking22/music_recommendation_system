[project]
name = "music-recommendation-api"
version = "0.1.0"
description = "FastAPI service for the music recommendation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "redis==7.4.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
