name: Release quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      REDIS_URL: redis://localhost:6379/0
      ENABLE_MUSIC_PROVIDERS: 'false'
      LLM_PROVIDER: local
      LLM_API_KEY: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e '.[dev,mcp]'
      - run: python -m ruff check app tests scripts
      - run: python -m compileall -q app migrations scripts
      - run: python -m pytest -q
      - run: python -m app.domain.evaluation
      - name: Build and inspect distributable fixtures
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/music-wheel .
          python scripts/wheel_smoke.py /tmp/music-wheel
      - name: Full offline PostgreSQL migration SQL
        env:
          DATABASE_URL: postgresql+psycopg://music:placeholder@localhost/music
        run: |
          alembic upgrade head --sql > /tmp/upgrade.sql
          alembic downgrade 0009_candidate_pool:base --sql > /tmp/downgrade.sql
      - name: Legacy help and HTTP smoke
        working-directory: .
        run: python scripts/legacy_smoke.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit

  clean-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: music-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: music_recommendation
      POSTGRES_USER: music
      REDIS_URL: redis://redis:6379/0
      ENABLE_MUSIC_PROVIDERS: 'false'
      LLM_PROVIDER: local
      LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Ephemeral local-only database credential
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg://music:$password@postgres:5432/music_recommendation" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Isolated migration round-trip
        run: |
          docker compose exec -T api alembic downgrade 0006_recording_resolution
          docker compose exec -T api alembic upgrade head
      - run: docker compose exec -T api python scripts/docker_smoke.py
      - run: docker compose exec -T api python scripts/account_postgres_check.py
      - name: Current revision and migration drift
        run: |
          docker compose exec -T api alembic current
          docker compose exec -T api alembic check
      - name: Inspect failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove this disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
